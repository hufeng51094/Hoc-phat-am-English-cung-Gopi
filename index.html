<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>English Pronunciation Tool</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background: #f0f4ff; margin: 20px; color: #333; }
    h2 { color: #4a6cf7; }
    textarea { width: 60%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }
    button { background: #4a6cf7; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; }
    button:hover { background: #3a56c7; }
    #result { margin-top:20px; font-size:18px; }
    .ipa { font-weight:600; color:#222; }
    .translation { color:#4a6cf7; font-style:italic; }
    table { border-collapse: collapse; margin-top: 20px; width: 70%; background: white; border-radius: 8px; overflow: hidden; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    th { background: #4a6cf7; color: white; }
  </style>
</head>
<body>
  <h2>🔊 Luyện phát âm từ vựng cùng Gopi 🐱🐷</h2>
  <textarea id="textInput" rows="3" placeholder="Paste your word or sentence here..."></textarea>
  <br><br>
  <button onclick="processInput()">Speak + IPA + Translate</button>
  <div id="result"></div>

  <h3>IPA Vowels (Nguyên âm đơn)</h3>
  <table>
    <tr><th>IPA</th><th>Example</th><th>Listen</th></tr>
    <tr><td>/iː/</td><td>seat</td><td><button onclick="speakWord('seat')">🔊</button></td></tr>
    <tr><td>/ɪ/</td><td>sit</td><td><button onclick="speakWord('sit')">🔊</button></td></tr>
    <tr><td>/æ/</td><td>cat</td><td><button onclick="speakWord('cat')">🔊</button></td></tr>
    <tr><td>/ʌ/</td><td>cup</td><td><button onclick="speakWord('cup')">🔊</button></td></tr>
    <tr><td>/ɑː/</td><td>father</td><td><button onclick="speakWord('father')">🔊</button></td></tr>
    <tr><td>/ɔː/</td><td>law</td><td><button onclick="speakWord('law')">🔊</button></td></tr>
    <tr><td>/uː/</td><td>food</td><td><button onclick="speakWord('food')">🔊</button></td></tr>
    <tr><td>/ʊ/</td><td>book</td><td><button onclick="speakWord('book')">🔊</button></td></tr>
    <tr><td>/e/</td><td>bed</td><td><button onclick="speakWord('bed')">🔊</button></td></tr>
    <tr><td>/ə/</td><td>about</td><td><button onclick="speakWord('about')">🔊</button></td></tr>
  </table>

  <h3>Diphthongs (Nguyên âm đôi)</h3>
  <table>
    <tr><th>IPA</th><th>Example</th><th>Listen</th></tr>
    <tr><td>/aɪ/</td><td>time</td><td><button onclick="speakWord('time')">🔊</button></td></tr>
    <tr><td>/eɪ/</td><td>day</td><td><button onclick="speakWord('day')">🔊</button></td></tr>
    <tr><td>/oʊ/</td><td>go</td><td><button onclick="speakWord('go')">🔊</button></td></tr>
    <tr><td>/aʊ/</td><td>house</td><td><button onclick="speakWord('house')">🔊</button></td></tr>
    <tr><td>/ɔɪ/</td><td>boy</td><td><button onclick="speakWord('boy')">🔊</button></td></tr>
  </table>

  <script>
    async function processInput() {
      const text = document.getElementById('textInput').value.trim();
      if (!text) return;

      // Phát âm
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      speechSynthesis.speak(utterance);

      let ipaText = "";
      let translationText = "";

      // Lấy IPA (chỉ cho từ đơn, câu dài có thể không có IPA)
      try {
        const ipaResponse = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${text.toLowerCase()}`);
        const ipaData = await ipaResponse.json();
        if (ipaData[0] && ipaData[0].phonetics && ipaData[0].phonetics[0].text) {
          ipaText = ipaData[0].phonetics[0].text;
        }
      } catch (err) {
        ipaText = "(không tìm thấy IPA)";
      }

      // Dịch nghĩa tiếng Việt cho cả câu
      try {
        const transResponse = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|vi`);
        const transData = await transResponse.json();
        if (transData.responseData.translatedText) {
          translationText = transData.responseData.translatedText;
        }
      } catch (err) {
        translationText = "(không dịch được)";
      }

      // Hiển thị kết quả
      document.getElementById('result').innerHTML = `
        <div class="ipa">IPA: ${ipaText || "(không có IPA)"}</div>
        <div class="translation">📖 Dịch: ${translationText}</div>
      `;
    }

    function speakWord(word) {
      const utterance = new SpeechSynthesisUtterance(word);
      utterance.lang = 'en-US';
      speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
